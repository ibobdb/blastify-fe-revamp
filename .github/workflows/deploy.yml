name: Deploy
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Next Version
        id: next-version
        uses: anothrNick/github-tag-action@v1.67.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: false
          DEFAULT_BUMP: patch

      - name: Set Tag Output
        run: echo "tag=${{ steps.next-version.outputs.new_tag }}" >> $GITHUB_OUTPUT

  docker:
    runs-on: ubuntu-latest
    needs: create-tag
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Latest Tag
        id: get-latest-tag
        run: |
          TAG=$(git describe --tags --abbrev=0)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/blastify-fe-revamp:${{ steps.get-latest-tag.outputs.tag }}
          build-args: |
            GIT_TAG=${{ steps.get-latest-tag.outputs.tag }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_NAME=${{ secrets.NEXT_PUBLIC_APP_NAME }}
            NEXT_PUBLIC_API_KEY=${{ secrets.NEXT_PUBLIC_API_KEY }}
            NEXT_PUBLIC_MIDTRANS_CLIENT_KEY=${{ secrets.NEXT_PUBLIC_MIDTRANS_CLIENT_KEY }}

      - name: Verify Environment Variables in Image
        run: |
          echo "Testing built image..."
          docker run --rm ${{ secrets.DOCKER_USERNAME }}/blastify-fe-revamp:${{ steps.get-latest-tag.outputs.tag }} env | grep NEXT_PUBLIC || echo "NEXT_PUBLIC secrets not found"
